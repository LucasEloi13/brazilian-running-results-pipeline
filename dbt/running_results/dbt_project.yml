name: 'running_results'
version: '1.0.0'

profile: 'running_results'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         
  - "target"
  - "dbt_packages"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

models:
  running_results:
    +database: "awsdatacatalog"

    staging:
      +materialized: view
      +schema: "staging"

    intermediate:
      +materialized: view
      +schema: "intermediate"
